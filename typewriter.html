<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Typewriter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .timer-display {
            background: #2d3748;
            color: #63b3ed;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .timer-display .time {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .timer-display .status {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 5px;
        }

        .typing-area {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #typingInput {
            width: 100%;
            height: 200px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        #typingInput:focus {
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-start {
            background: #48bb78;
            color: white;
        }

        .btn-start:hover {
            background: #38a169;
        }

        .btn-reset {
            background: #f56565;
            color: white;
        }

        .btn-reset:hover {
            background: #e53e3e;
        }

        .btn-clear {
            background: #ed8936;
            color: white;
        }

        .btn-clear:hover {
            background: #dd6b20;
        }

        .btn-stop {
            background: #4299e1;
            color: white;
        }

        .btn-stop:hover {
            background: #3182ce;
        }

        .btn-restore {
            background: #9f7aea;
            color: white;
        }

        .btn-restore:hover {
            background: #805ad5;
        }

        .mishaps-log {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .mishaps-log h3 {
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        #mishapsList {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .mishap-item {
            background: #fff5f5;
            border-left: 3px solid #fc8181;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
        }

        .mishap-time {
            color: #e53e3e;
            font-weight: bold;
        }

        .no-mishaps {
            color: #a0aec0;
            text-align: center;
            padding: 20px;
        }

        .instructions {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }

        .instructions p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨️ Digital Typewriter</h1>
        
        <div class="instructions">
            <p>📝 Start typing to begin the timer | Track your WPM, typos, and correction times</p>
        </div>

        <div class="timer-display">
            <div class="time" id="timer">00:00.00</div>
            <div class="status" id="timerStatus">Ready to type...</div>
        </div>

        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">WPM</div>
                    <div class="stat-value" id="wpm">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Characters</div>
                    <div class="stat-value" id="charCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Typos</div>
                    <div class="stat-value" id="typoCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Avg Fix Time</div>
                    <div class="stat-value" id="avgFixTime">0ms</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="accuracy">100%</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startTyping()">Start</button>
            <button class="btn-stop" id="stopBtn" onclick="stopTyping()" disabled>Stop</button>
            <button class="btn-clear" onclick="clearText()">Clear Text</button>
            <button class="btn-restore" id="restoreBtn" onclick="restoreText()" disabled>Restore (0)</button>
            <button class="btn-reset" onclick="resetAll()">Reset All</button>
        </div>

        <div class="typing-area">
            <textarea id="typingInput" placeholder="Start typing here... The timer will begin automatically when you start typing." oninput="handleInput()" onkeydown="handleKeyDown()"></textarea>
        </div>

        <div class="mishaps-log">
            <h3>📋 Mishaps Log</h3>
            <ul id="mishapsList">
                <li class="no-mishaps">No typos recorded yet. Keep it clean! ✨</li>
            </ul>
        </div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        let isTyping = false;
        let totalCharacters = 0;
        let typoCount = 0;
        let fixTimes = [];
        let lastTypoTime = null;
        let previousText = '';
        let charHistory = [];
        let textSnapshots = []; // Store up to 50 text snapshots for restore
        const MAX_SNAPSHOTS = 50;

        const timerDisplay = document.getElementById('timer');
        const timerStatus = document.getElementById('timerStatus');
        const typingInput = document.getElementById('typingInput');
        const wpmDisplay = document.getElementById('wpm');
        const charCountDisplay = document.getElementById('charCount');
        const typoCountDisplay = document.getElementById('typoCount');
        const avgFixTimeDisplay = document.getElementById('avgFixTime');
        const accuracyDisplay = document.getElementById('accuracy');
        const mishapsList = document.getElementById('mishapsList');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const restoreBtn = document.getElementById('restoreBtn');

        function updateTimer() {
            if (!startTime) return;
            
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const milliseconds = elapsed % 1000;

            timerDisplay.textContent = 
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0') + '.' +
                String(milliseconds).padStart(2, '0').substring(0, 2);
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 10);
            isTyping = true;
            timerStatus.textContent = '⏱️ Typing in progress...';
            startBtn.disabled = true;
            startBtn.style.opacity = '0.5';
            stopBtn.disabled = false;
            stopBtn.style.opacity = '1';
        }

        function stopTyping() {
            stopTimer();
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTyping = false;
            timerStatus.textContent = '⏸️ Paused';
            startBtn.disabled = false;
            startBtn.style.opacity = '1';
            stopBtn.disabled = true;
            stopBtn.style.opacity = '0.5';
        }

        function startTyping() {
            if (!isTyping && typingInput.value.length > 0) {
                startTimer();
            } else if (!isTyping) {
                startTimer();
                typingInput.focus();
            }
        }

        function detectTypos(currentText) {
            const currentLength = currentText.length;
            const previousLength = previousText.length;
            
            // Check if backspace was used (text got shorter)
            if (currentLength < previousLength) {
                const deletedChars = previousLength - currentLength;
                
                // If we deleted characters and had typed before, it might be a typo fix
                if (charHistory.length > 0 && deletedChars > 0) {
                    const now = Date.now();
                    
                    // Check if this looks like a typo correction
                    // (deleting recently typed characters)
                    if (lastTypoTime === null) {
                        // This is a new typo detection
                        lastTypoTime = now;
                        typoCount++;
                        
                        // Log the mishap
                        logMishap(currentText, deletedChars);
                    }
                }
            }
            
            // Reset typo timer when new characters are added
            if (currentLength > previousLength) {
                lastTypoTime = null;
                
                // Track characters for history
                const addedChars = currentText.slice(previousLength);
                charHistory.push({
                    chars: addedChars,
                    time: Date.now()
                });
            }
            
            previousText = currentText;
        }

        function logMishap(text, deletedCount) {
            const noMishapsMsg = mishapsList.querySelector('.no-mishaps');
            if (noMishapsMsg) {
                noMishapsMsg.remove();
            }

            const li = document.createElement('li');
            li.className = 'mishap-item';
            
            const timeStr = new Date().toLocaleTimeString();
            const contextStart = Math.max(0, text.length - 20);
            const context = text.slice(contextStart);
            
            li.innerHTML = `
                <strong>Typo #${typoCount}</strong> at ${timeStr}<br>
                <span class="mishap-time">${deletedCount} character(s) deleted</span><br>
                Context: "...${escapeHtml(context)}"
            `;
            
            mishapsList.insertBefore(li, mishapsList.firstChild);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function calculateStats() {
            const currentTime = typingInput.value.length;
            totalCharacters = currentTime;
            
            // Calculate WPM (words per minute)
            let wpm = 0;
            if (startTime && totalCharacters > 0) {
                const elapsedMinutes = (Date.now() - startTime) / 60000;
                if (elapsedMinutes > 0) {
                    const words = totalCharacters / 5; // Standard: 5 chars = 1 word
                    wpm = Math.round(words / elapsedMinutes);
                }
            }
            
            // Calculate accuracy
            let accuracy = 100;
            if (totalCharacters + typoCount > 0) {
                accuracy = Math.round((totalCharacters / (totalCharacters + typoCount)) * 100);
            }
            
            // Calculate average fix time (placeholder - would need more sophisticated tracking)
            const avgFixTime = fixTimes.length > 0 
                ? Math.round(fixTimes.reduce((a, b) => a + b, 0) / fixTimes.length)
                : 0;
            
            // Update displays
            wpmDisplay.textContent = wpm;
            charCountDisplay.textContent = totalCharacters;
            typoCountDisplay.textContent = typoCount;
            avgFixTimeDisplay.textContent = avgFixTime + 'ms';
            accuracyDisplay.textContent = accuracy + '%';
        }

        function handleInput() {
            // Auto-start timer on first keystroke
            if (!isTyping && typingInput.value.length > 0) {
                startTimer();
            }
            
            // Save snapshot before clearing (if text exists and we're about to clear)
            if (previousText.length > 0 && typingInput.value.length === 0) {
                saveSnapshot(previousText);
            }
            
            detectTypos(typingInput.value);
            calculateStats();
            updateRestoreButton();
        }

        function handleKeyDown(e) {
            // Track backspace for potential typo detection
            if (e.key === 'Backspace' || e.key === 'Delete') {
                if (isTyping && typingInput.value.length > 0) {
                    const now = Date.now();
                    if (lastTypoTime !== null) {
                        const fixTime = now - lastTypoTime;
                        fixTimes.push(fixTime);
                    }
                }
            }
        }

        function saveSnapshot(text) {
            if (text.trim().length > 0) {
                textSnapshots.unshift({
                    text: text,
                    timestamp: new Date().toLocaleTimeString(),
                    charCount: text.length
                });
                
                // Keep only the last 50 snapshots
                if (textSnapshots.length > MAX_SNAPSHOTS) {
                    textSnapshots = textSnapshots.slice(0, MAX_SNAPSHOTS);
                }
                
                updateRestoreButton();
            }
        }

        function restoreText() {
            if (textSnapshots.length === 0) return;
            
            const latest = textSnapshots.shift();
            typingInput.value = latest.text;
            previousText = latest.text;
            
            // Log the restoration as a mishap
            const noMishapsMsg = mishapsList.querySelector('.no-mishaps');
            if (noMishapsMsg) {
                noMishapsMsg.remove();
            }

            const li = document.createElement('li');
            li.className = 'mishap-item';
            li.style.borderLeftColor = '#9f7aea';
            li.style.background = '#faf5ff';
            
            li.innerHTML = `
                <strong>📝 Text Restored</strong> at ${latest.timestamp}<br>
                <span class="mishap-time\">${latest.charCount} characters restored</span><br>
                Context: "...${escapeHtml(latest.text.slice(-20))}"
            `;
            
            mishapsList.insertBefore(li, mishapsList.firstChild);
            
            calculateStats();
            updateRestoreButton();
            typingInput.focus();
        }

        function updateRestoreButton() {
            restoreBtn.disabled = textSnapshots.length === 0;
            restoreBtn.textContent = `Restore (${textSnapshots.length})`;
            restoreBtn.style.opacity = textSnapshots.length === 0 ? '0.5' : '1';
        }

        function clearText() {
            // Save snapshot before clearing if there's text
            if (typingInput.value.length > 0) {
                saveSnapshot(typingInput.value);
            }
            typingInput.value = '';
            previousText = '';
            charHistory = [];
            calculateStats();
            typingInput.focus();
        }

        function resetAll() {
            stopTimer();
            timerDisplay.textContent = '00:00.00';
            timerStatus.textContent = 'Ready to type...';
            typingInput.value = '';
            previousText = '';
            charHistory = [];
            textSnapshots = [];
            totalCharacters = 0;
            typoCount = 0;
            fixTimes = [];
            lastTypoTime = null;
            startTime = null;
            
            wpmDisplay.textContent = '0';
            charCountDisplay.textContent = '0';
            typoCountDisplay.textContent = '0';
            avgFixTimeDisplay.textContent = '0ms';
            accuracyDisplay.textContent = '100%';
            
            mishapsList.innerHTML = '<li class="no-mishaps">No typos recorded yet. Keep it clean! ✨</li>';
            startBtn.disabled = false;
            startBtn.style.opacity = '1';
            stopBtn.disabled = true;
            stopBtn.style.opacity = '0.5';
            restoreBtn.disabled = true;
            restoreBtn.textContent = 'Restore (0)';
            restoreBtn.style.opacity = '0.5';
            typingInput.focus();
        }

        // Initialize
        typingInput.focus();
    </script>
</body>
</html>
