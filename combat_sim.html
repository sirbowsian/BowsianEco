<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Combat Simulator - First Person</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #gameCanvas {
            display: block;
            cursor: none;
        }
        
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
            left: 0;
        }
        
        .hud-element {
            position: absolute;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            font-size: 18px;
            font-weight: bold;
        }
        
        #health-bar {
            bottom: 30px;
            left: 30px;
        }
        
        #ammo-display {
            bottom: 30px;
            right: 30px;
        }
        
        #score-display {
            top: 30px;
            left: 30px;
        }
        
        #wave-display {
            top: 30px;
            right: 30px;
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px #f00;
            display: none;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 100;
        }
        
        #start-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #f00;
            text-shadow: 0 0 20px #f00;
        }
        
        #start-screen p {
            font-size: 18px;
            margin: 10px 0;
            color: #0f0;
        }
        
        #start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            background: #f00;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }
        
        #start-btn:hover {
            background: #ff4444;
        }
        
        .health-fill {
            width: 200px;
            height: 20px;
            border: 2px solid #0f0;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 5px;
        }
        
        #health-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f00, #0f0);
            transition: width 0.3s;
        }
        
        #minimap {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            border: 2px solid #0f0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div id="crosshair"></div>
        
        <div id="health-bar" class="hud-element">
            HEALTH
            <div class="health-fill">
                <div id="health-inner"></div>
            </div>
        </div>
        
        <div id="ammo-display" class="hud-element">
            AMMO: <span id="ammo-count">30</span> / <span id="ammo-reserve">90</span>
        </div>
        
        <div id="score-display" class="hud-element">
            KILLS: <span id="score">0</span>
        </div>
        
        <div id="wave-display" class="hud-element">
            WAVE: <span id="wave">1</span>
        </div>
        
        <canvas id="minimap"></canvas>
        
        <div id="message"></div>
    </div>
    
    <div id="start-screen">
        <h1>WAR COMBAT SIMULATOR</h1>
        <p>WASD - Move</p>
        <p>MOUSE - Aim</p>
        <p>LEFT CLICK - Shoot</p>
        <p>R - Reload</p>
        <p>Survive as long as you can!</p>
        <button id="start-btn">START MISSION</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        minimapCanvas.width = 150;
        minimapCanvas.height = 150;
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let wave = 1;
        let lastTime = 0;
        
        // Player
        const player = {
            x: 0,
            y: 0,
            z: 0,
            health: 100,
            maxHealth: 100,
            ammo: 30,
            reserveAmmo: 90,
            maxAmmo: 30,
            speed: 5,
            yaw: 0,
            pitch: 0,
            reloading: false,
            reloadTime: 2000,
            lastShot: 0,
            fireRate: 100
        };
        
        // Input
        const keys = {};
        let mouseX = 0, mouseY = 0;
        let mouseDown = false;
        
        // Enemies
        let enemies = [];
        let bullets = [];
        let particles = [];
        let explosions = [];
        
        // World
        const worldSize = 200;
        const buildings = [];
        
        // Generate buildings
        function generateBuildings() {
            buildings.length = 0;
            for (let i = 0; i < 30; i++) {
                buildings.push({
                    x: (Math.random() - 0.5) * worldSize * 2,
                    y: 0,
                    z: (Math.random() - 0.5) * worldSize * 2,
                    width: 10 + Math.random() * 20,
                    height: 20 + Math.random() * 40,
                    depth: 10 + Math.random() * 20,
                    color: `rgb(${50 + Math.random() * 100}, ${50 + Math.random() * 100}, ${50 + Math.random() * 100})`
                });
            }
        }
        
        // Spawn enemy
        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 100;
            enemies.push({
                x: player.x + Math.cos(angle) * distance,
                y: 0,
                z: player.z + Math.sin(angle) * distance,
                health: 30 + wave * 10,
                maxHealth: 30 + wave * 10,
                speed: 2 + Math.random() * 2 + wave * 0.3,
                damage: 10 + wave * 2,
                lastAttack: 0,
                attackCooldown: 1000
            });
        }
        
        // 3D projection
        function project(x, y, z) {
            const dx = x - player.x;
            const dy = y - player.y;
            const dz = z - player.z;
            
            // Rotate around Y axis (yaw)
            const cosYaw = Math.cos(-player.yaw);
            const sinYaw = Math.sin(-player.yaw);
            const rx = dx * cosYaw - dz * sinYaw;
            const rz = dx * sinYaw + dz * cosYaw;
            
            // Rotate around X axis (pitch)
            const cosPitch = Math.cos(-player.pitch);
            const sinPitch = Math.sin(-player.pitch);
            const ry = dy * cosPitch - rz * sinPitch;
            const rz2 = dy * sinPitch + rz * cosPitch;
            
            if (rz2 <= 0.1) return null;
            
            const fov = 500;
            const sx = canvas.width / 2 + (rx * fov) / rz2;
            const sy = canvas.height / 2 - (ry * fov) / rz2;
            const scale = fov / rz2;
            
            return { x: sx, y: sy, scale: scale, z: rz2 };
        }
        
        // Draw building face
        function drawBuildingFace(points, color, brightness = 1) {
            if (points.some(p => p === null)) return;
            if (points.every(p => p.z < 0.1)) return;
            
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            
            const r = Math.min(255, parseInt(color.slice(4, color.indexOf(','))) * brightness);
            const g = Math.min(255, parseInt(color.slice(color.indexOf(',') + 1, color.lastIndexOf(','))) * brightness);
            const b = Math.min(255, parseInt(color.slice(color.lastIndexOf(',') + 1, -1)) * brightness);
            
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.stroke();
        }
        
        // Draw buildings
        function drawBuildings() {
            const sortedBuildings = buildings.map(b => {
                const dz = Math.sqrt((b.x - player.x) ** 2 + (b.z - player.z) ** 2);
                return { ...b, dist: dz };
            }).sort((a, b) => b.dist - a.dist);
            
            sortedBuildings.forEach(building => {
                const hw = building.width / 2;
                const hd = building.depth / 2;
                
                const corners = [
                    { x: building.x - hw, y: building.y, z: building.z - hd },
                    { x: building.x + hw, y: building.y, z: building.z - hd },
                    { x: building.x + hw, y: building.y + building.height, z: building.z - hd },
                    { x: building.x - hw, y: building.y + building.height, z: building.z - hd },
                    { x: building.x - hw, y: building.y, z: building.z + hd },
                    { x: building.x + hw, y: building.y, z: building.z + hd },
                    { x: building.x + hw, y: building.y + building.height, z: building.z + hd },
                    { x: building.x - hw, y: building.y + building.height, z: building.z + hd }
                ];
                
                const projected = corners.map(c => project(c.x, c.y, c.z));
                
                if (projected.every(p => p !== null)) {
                    // Front face
                    drawBuildingFace([projected[0], projected[1], projected[2], projected[3]], building.color, 1);
                    // Back face
                    drawBuildingFace([projected[5], projected[4], projected[7], projected[6]], building.color, 0.6);
                    // Left face
                    drawBuildingFace([projected[0], projected[3], projected[7], projected[4]], building.color, 0.8);
                    // Right face
                    drawBuildingFace([projected[1], projected[5], projected[6], projected[2]], building.color, 0.8);
                    // Top face
                    drawBuildingFace([projected[3], projected[2], projected[6], projected[7]], building.color, 1.2);
                }
            });
        }
        
        // Draw enemy
        function drawEnemy(enemy) {
            const p = project(enemy.x, enemy.y + 1.7, enemy.z);
            if (!p || p.z < 0.1) return;
            
            const size = 40 * p.scale;
            const x = p.x;
            const y = p.y;
            
            // Body
            ctx.fillStyle = '#4a4';
            ctx.fillRect(x - size/2, y - size, size, size * 1.5);
            
            // Head
            ctx.fillStyle = '#dba';
            ctx.beginPath();
            ctx.arc(x, y - size * 1.2, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // Health bar
            const healthPercent = enemy.health / enemy.maxHealth;
            ctx.fillStyle = '#300';
            ctx.fillRect(x - size/2, y - size * 1.7, size, 5);
            ctx.fillStyle = '#f00';
            ctx.fillRect(x - size/2, y - size * 1.7, size * healthPercent, 5);
        }
        
        // Draw ground
        function drawGround() {
            const horizon = canvas.height / 2;
            
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, horizon);
            skyGradient.addColorStop(0, '#1a1a2e');
            skyGradient.addColorStop(1, '#4a4a6a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, horizon);
            
            // Ground gradient
            const groundGradient = ctx.createLinearGradient(0, horizon, 0, canvas.height);
            groundGradient.addColorStop(0, '#2d5016');
            groundGradient.addColorStop(1, '#1a3009');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);
            
            // Grid lines on ground
            ctx.strokeStyle = 'rgba(0, 50, 0, 0.3)';
            ctx.lineWidth = 1;
            
            for (let i = -worldSize; i <= worldSize; i += 20) {
                const start = project(i, 0, -worldSize);
                const end = project(i, 0, worldSize);
                if (start && end && start.z > 0.1 && end.z > 0.1) {
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();
                }
            }
            
            for (let i = -worldSize; i <= worldSize; i += 20) {
                const start = project(-worldSize, 0, i);
                const end = project(worldSize, 0, i);
                if (start && end && start.z > 0.1 && end.z > 0.1) {
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();
                }
            }
        }
        
        // Draw weapon
        function drawWeapon() {
            const bobOffset = Math.sin(Date.now() / 150) * (keys['w'] || keys['s'] || keys['a'] || keys['d'] ? 5 : 0);
            const recoilOffset = Date.now() - player.lastShot < 100 ? 20 : 0;
            
            const weaponX = canvas.width / 2 + 150;
            const weaponY = canvas.height - 200 + bobOffset + recoilOffset;
            
            // Gun body
            ctx.fillStyle = '#333';
            ctx.fillRect(weaponX - 20, weaponY, 80, 40);
            ctx.fillStyle = '#222';
            ctx.fillRect(weaponX + 60, weaponY + 10, 60, 20);
            
            // Magazine
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(weaponX + 10, weaponY + 40, 30, 50);
            
            // Details
            ctx.fillStyle = '#444';
            ctx.fillRect(weaponX + 70, weaponY + 5, 40, 10);
            
            // Muzzle flash
            if (Date.now() - player.lastShot < 50) {
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(weaponX + 130, weaponY + 20, 20 + Math.random() * 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(weaponX + 130, weaponY + 20, 10 + Math.random() * 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Update player
        function updatePlayer(dt) {
            const moveSpeed = player.speed;
            let dx = 0, dz = 0;
            
            if (keys['w']) dz -= moveSpeed;
            if (keys['s']) dz += moveSpeed;
            if (keys['a']) dx -= moveSpeed;
            if (keys['d']) dx += moveSpeed;
            
            // Rotate movement by yaw
            const cosYaw = Math.cos(player.yaw);
            const sinYaw = Math.sin(player.yaw);
            player.x += dx * cosYaw - dz * sinYaw;
            player.z += dx * sinYaw + dz * cosYaw;
            
            // Clamp to world bounds
            player.x = Math.max(-worldSize, Math.min(worldSize, player.x));
            player.z = Math.max(-worldSize, Math.min(worldSize, player.z));
            
            // Reload
            if (keys['r'] && !player.reloading && player.ammo < player.maxAmmo && player.reserveAmmo > 0) {
                player.reloading = true;
                setTimeout(() => {
                    const needed = player.maxAmmo - player.ammo;
                    const available = Math.min(needed, player.reserveAmmo);
                    player.ammo += available;
                    player.reserveAmmo -= available;
                    player.reloading = false;
                    updateHUD();
                }, player.reloadTime);
            }
            
            // Shooting
            if (mouseDown && !player.reloading && player.ammo > 0 && Date.now() - player.lastShot > player.fireRate) {
                shoot();
            }
        }
        
        // Shoot
        function shoot() {
            player.ammo--;
            player.lastShot = Date.now();
            updateHUD();
            
            // Create bullet
            const dirX = Math.sin(player.yaw) * Math.cos(player.pitch);
            const dirZ = Math.cos(player.yaw) * Math.cos(player.pitch);
            const dirY = Math.sin(player.pitch);
            
            bullets.push({
                x: player.x,
                y: player.y + 1.7,
                z: player.z,
                dirX: dirX,
                dirY: dirY,
                dirZ: dirZ,
                life: 100
            });
            
            // Check hit
            enemies.forEach((enemy, index) => {
                const dx = enemy.x - player.x;
                const dy = (enemy.y + 1.7) - (player.y + 1.7);
                const dz = enemy.z - player.z;
                const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                // Simple hit detection based on aim direction
                const aimDist = Math.sqrt(dirX*dirX + dirY*dirY + dirZ*dirZ);
                const dot = (dx * dirX + dy * dirY + dz * dirZ) / (dist * aimDist);
                
                if (dot > 0.95 && dist < 100) {
                    enemy.health -= 25;
                    
                    // Blood particles
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: enemy.x,
                            y: enemy.y + 1.7,
                            z: enemy.z,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10,
                            vz: (Math.random() - 0.5) * 10,
                            life: 30,
                            color: '#f00'
                        });
                    }
                    
                    if (enemy.health <= 0) {
                        enemies.splice(index, 1);
                        score++;
                        
                        // Explosion particles
                        for (let i = 0; i < 20; i++) {
                            particles.push({
                                x: enemy.x,
                                y: enemy.y + 1.7,
                                z: enemy.z,
                                vx: (Math.random() - 0.5) * 15,
                                vy: (Math.random() - 0.5) * 15,
                                vz: (Math.random() - 0.5) * 15,
                                life: 40,
                                color: '#fa0'
                            });
                        }
                        
                        updateHUD();
                    }
                }
            });
        }
        
        // Update enemies
        function updateEnemies() {
            enemies.forEach(enemy => {
                const dx = player.x - enemy.x;
                const dz = player.z - enemy.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist > 5) {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.z += (dz / dist) * enemy.speed;
                } else if (Date.now() - enemy.lastAttack > enemy.attackCooldown) {
                    player.health -= enemy.damage;
                    enemy.lastAttack = Date.now();
                    updateHUD();
                    
                    // Screen shake effect
                    canvas.style.transform = `translate(${Math.random() * 10 - 5}px, ${Math.random() * 10 - 5}px)`;
                    setTimeout(() => canvas.style.transform = 'none', 100);
                    
                    if (player.health <= 0) {
                        gameOver();
                    }
                }
            });
        }
        
        // Update particles
        function updateParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                p.vy -= 0.5;
                p.life--;
                if (p.life <= 0) particles.splice(index, 1);
            });
        }
        
        // Draw particles
        function drawParticles() {
            particles.forEach(p => {
                const proj = project(p.x, p.y, p.z);
                if (proj && proj.z > 0.1) {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, 3 * proj.scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        // Update minimap
        function updateMinimap() {
            minimapCtx.clearRect(0, 0, 150, 150);
            
            const centerX = 75;
            const centerY = 75;
            const mapScale = 1.5;
            
            // Draw player
            minimapCtx.fillStyle = '#0f0';
            minimapCtx.beginPath();
            minimapCtx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            minimapCtx.fill();
            
            // Draw player direction
            minimapCtx.strokeStyle = '#0f0';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(centerX, centerY);
            minimapCtx.lineTo(
                centerX + Math.sin(player.yaw) * 15,
                centerY - Math.cos(player.yaw) * 15
            );
            minimapCtx.stroke();
            
            // Draw enemies
            minimapCtx.fillStyle = '#f00';
            enemies.forEach(enemy => {
                const ex = centerX + (enemy.x - player.x) * mapScale;
                const ey = centerY + (enemy.z - player.z) * mapScale;
                if (ex >= 0 && ex <= 150 && ey >= 0 && ey <= 150) {
                    minimapCtx.beginPath();
                    minimapCtx.arc(ex, ey, 4, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            });
            
            // Draw buildings
            minimapCtx.fillStyle = '#555';
            buildings.forEach(building => {
                const bx = centerX + (building.x - player.x) * mapScale;
                const bz = centerY + (building.z - player.z) * mapScale;
                const bw = building.width * mapScale;
                const bd = building.depth * mapScale;
                if (bx + bw > 0 && bx - bw < 150 && bz + bd > 0 && bz - bd < 150) {
                    minimapCtx.fillRect(bx - bw/2, bz - bd/2, bw, bd);
                }
            });
        }
        
        // Update HUD
        function updateHUD() {
            document.getElementById('health-inner').style.width = `${(player.health / player.maxHealth) * 100}%`;
            document.getElementById('ammo-count').textContent = player.ammo;
            document.getElementById('ammo-reserve').textContent = player.reserveAmmo;
            document.getElementById('score').textContent = score;
            document.getElementById('wave').textContent = wave;
        }
        
        // Spawn wave
        let enemySpawnTimer = 0;
        function updateSpawning(dt) {
            enemySpawnTimer += dt;
            if (enemySpawnTimer > 2000 - wave * 100) {
                enemySpawnTimer = 0;
                if (enemies.length < 5 + wave * 2) {
                    spawnEnemy();
                }
            }
            
            // Increase wave
            if (score > wave * 10) {
                wave++;
                player.reserveAmmo += 30;
                player.health = Math.min(player.maxHealth, player.health + 25);
                updateHUD();
                showMessage(`WAVE ${wave}`);
            }
        }
        
        // Show message
        function showMessage(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 2000);
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            document.exitPointerLock();
            showMessage(`GAME OVER - Score: ${score} - Wave: ${wave}`);
            document.getElementById('start-screen').style.display = 'flex';
            document.querySelector('#start-screen h1').textContent = 'GAME OVER';
            document.getElementById('start-btn').textContent = 'RETRY';
        }
        
        // Main game loop
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update
            updatePlayer(dt);
            updateEnemies();
            updateParticles();
            updateSpawning(dt);
            
            // Draw
            drawGround();
            drawBuildings();
            enemies.forEach(drawEnemy);
            drawParticles();
            drawWeapon();
            updateMinimap();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            wave = 1;
            player.health = player.maxHealth;
            player.ammo = player.maxAmmo;
            player.reserveAmmo = 90;
            player.x = 0;
            player.z = 0;
            enemies = [];
            bullets = [];
            particles = [];
            
            generateBuildings();
            updateHUD();
            
            document.getElementById('start-screen').style.display = 'none';
            canvas.requestPointerLock();
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === canvas) {
                player.yaw += e.movementX * 0.002;
                player.pitch += e.movementY * 0.002;
                player.pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, player.pitch));
            }
        });
        
        document.addEventListener('mousedown', () => mouseDown = true);
        document.addEventListener('mouseup', () => mouseDown = false);
        
        document.getElementById('start-btn').addEventListener('click', startGame);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
